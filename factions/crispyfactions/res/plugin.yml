name: CrispyFactions
version: 1.2.0
main: crispy.factions.CrispyFactions
api-version: '1.21'
author: Crispy Network
description: Prime-time raid window, obsidian durability, Aegis Vacation Star, cactus collector, 1.8-era item rules, PvP combat tag, CS-style cases
depend: [Factions]
softdepend: [EconomyShopGUI, Essentials, Vault]
commands:
  raidwindow:
    description: Show the raid window schedule (admins - force open|closed|auto)
    aliases: [rw, raid]
  aegis:
    description: Aegis Vacation Star status (admins - give/collector/reset)
  cases:
    description: CS-style weapon cases (buy cases and keys, see the odds)
    aliases: [case, crates]
  combat:
    description: Show your PvP combat-tag timer
    aliases: [ct, combattag]
  nv:
    description: Toggle night vision
    permission: crispy.nv
  crispyfactions:
    description: Admin commands
    permission: crispy.admin
permissions:
  crispy.nv: {default: op}
  crispy.admin: {default: op}
  crispy.combat.bypass: {default: false}
  crispy.afk.extended: {default: false}
  crispy.afk.exempt: {default: op}
