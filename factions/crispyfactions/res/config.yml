# Prime-time raid window: explosions only damage faction claims inside these windows.
raid-window:
  enabled: false              # false = raids allowed any time; Aegis Stars then count real hours
  timezone: America/New_York
  windows:
    monday:    ["18:00-23:00"]
    tuesday:   ["18:00-23:00"]
    wednesday: ["18:00-23:00"]
    thursday:  ["18:00-23:00"]
    friday:    ["18:00-23:00"]
    saturday:  ["12:00-24:00"]
    sunday:    ["12:00-24:00"]

# Obsidian durability (5 TNT hits or 3 creeper hits). Blocks touching water/lava are immune; TNT exploding in water does nothing.
obsidian:
  enabled: true
  durability: 5.0
  tnt-damage: 1.0
  creeper-damage: 1.6667      # charged creepers do double
  radius: 3
  reset-minutes: 30           # damage forgotten after this long without another hit
  blocks: [OBSIDIAN, CRYING_OBSIDIAN]

# Aegis Vacation Star
aegis:
  raid-hours: 25
  no-activation-hours-before-window: 6
  cooldown-days: 14
  kit:
    first-friday: "2026-10-16"   # free /kit aegis every other Friday from this date
    min-playtime-hours: 10

# PvP combat tag: hitting or being hit by a player tags both for this long. While tagged: no escape commands,
# no teleporting into spawn (safezone), and logging out (or switching server) kills you. Kicks are not punished.
combat-tag:
  enabled: true
  seconds: 15
  kill-on-logout: true
  block-safezone-entry: true
  blocked-commands: [spawn, home, homes, back, warp, warps, tpa, tpahere, tpaccept, tpyes, tpaall, tp, tpo, tphere, top,
    f home, f stuck, f warp, f warps, ec, echest, enderchest, ender, wild, rtp, kit, kits, fly, god, vanish, v]

afk:
  default-minutes: 30
  rank-minutes: 120           # players with crispy.afk.extended

# Phase 2: on day 11 the shop's Phase2 section (iron golem spawners, iron ingot selling) is switched on.
phase2:
  launch-date: "2026-10-16"
  unlock-after-days: 10
  iron-sell: 40
  reload-commands: ["sreload"]

# CS2-style weapon cases (in-game money only). A Crispy Case (monster drop or /cases) + a Case Key (/cases) spins a roulette.
# Rarity weights are CS2's odds. Each reward picks one rarity, then one reward of that rarity at random.
# Reward fields: rarity, and one of money | item+amount | skin+item (+enchants) | special: aegis. Optional name (label).
cases:
  enabled: true
  case-price: 2500
  key-price: 15000
  drop-chance: 0.004          # per monster killed by a player (spawner mobs never drop cases)
  stattrak-chance: 0.10       # skins: chance of a StatTrak kill counter
  broadcast-rarities: [covert, gold]
  rarities:
    milspec:    {name: "Mil-Spec Grade", color: "&9", weight: 79.92, pane: BLUE_STAINED_GLASS_PANE}
    restricted: {name: "Restricted", color: "&5", weight: 15.98, pane: PURPLE_STAINED_GLASS_PANE}
    classified: {name: "Classified", color: "&d", weight: 3.20, pane: MAGENTA_STAINED_GLASS_PANE}
    covert:     {name: "Covert", color: "&c", weight: 0.64, pane: RED_STAINED_GLASS_PANE}
    gold:       {name: "★ Rare Special Item", color: "&6", weight: 0.26, pane: YELLOW_STAINED_GLASS_PANE}
  rewards:
    - {rarity: milspec, money: 10000}
    - {rarity: milspec, item: OBSIDIAN, amount: 48}
    - {rarity: milspec, item: TNT, amount: 64}
    - {rarity: milspec, item: ENDER_PEARL, amount: 16}
    - {rarity: milspec, skin: "P250 | Sand Dune", item: IRON_SWORD}
    - {rarity: milspec, skin: "Nova | Polar Mesh", item: BOW}
    - {rarity: restricted, money: 25000}
    - {rarity: restricted, item: OBSIDIAN, amount: 128}
    - {rarity: restricted, item: CREEPER_SPAWN_EGG, amount: 2}
    - {rarity: restricted, skin: "M4A4 | Desert-Strike", item: DIAMOND_SWORD}
    - {rarity: restricted, skin: "SSG 08 | Blood in the Water", item: BOW, enchants: {power: 2}}
    - {rarity: classified, money: 75000}
    - {rarity: classified, item: ENCHANTED_GOLDEN_APPLE, amount: 2}
    - {rarity: classified, skin: "AK-47 | Redline", item: DIAMOND_SWORD, enchants: {sharpness: 2}}
    - {rarity: classified, skin: "Desert Eagle | Blaze", item: DIAMOND_AXE, enchants: {sharpness: 2}}
    - {rarity: covert, money: 200000}
    - {rarity: covert, skin: "AWP | Dragon Lore", item: BOW, enchants: {power: 4, punch: 1}}
    - {rarity: covert, skin: "AK-47 | Fire Serpent", item: DIAMOND_SWORD, enchants: {sharpness: 3, fire_aspect: 1}}
    - {rarity: gold, skin: "★ Karambit | Fade", item: DIAMOND_SWORD, enchants: {sharpness: 5, unbreaking: 3, fire_aspect: 2}}
    - {rarity: gold, skin: "★ Butterfly Knife | Doppler", item: DIAMOND_SWORD, enchants: {sharpness: 5, unbreaking: 3, looting: 3}}
    - {rarity: gold, special: aegis, name: "Aegis Vacation Star"}

# Server-list voting (NuVotifier). Each vote: money + Crispy Case; every Nth vote a bonus Case Key; vote party for everyone online.
# Votes for players who are offline are kept and handed out when they join. Admin: /vote test <player> [site], /vote party
votes:
  enabled: true
  money: 5000
  cases: 1
  bonus-key-every: 5
  party-goal: 30
  broadcast: true
  links:     # shown by /vote (entries still containing CHANGE_ME are hidden)
    - {name: "PlanetMinecraft", url: "https://www.planetminecraft.com/server/crispy-anarchy-1-16-no-rules-survival/vote/"}
    - {name: "Minecraft-Server-List", url: "https://minecraft-server-list.com/server/CHANGE_ME/vote/"}
    - {name: "TopG", url: "https://topg.org/minecraft-servers/server-687311"}
    - {name: "Minecraft-MP", url: "https://minecraft-mp.com/server/CHANGE_ME/vote/"}
    - {name: "MinecraftServers.org", url: "https://minecraftservers.org/vote/587166"}
