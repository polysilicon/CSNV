a = "Yes: paste a TikTok, X/Twitter or Instagram post link and Yoink replies with the video so it plays in Discord (up to 2 links a message). Text tweets get a tweet card, with price charts for any `$TICKER` in them."
alts = ["tiktok video", "twitter link not embedding", "why does the bot post videos", "instagram reel", "embed twitter video"]

