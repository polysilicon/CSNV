[[entry]]
id = "tickers"
q = "How do I check a crypto or stock price?"
a = "Type a cashtag like `$BTC`, `$NVDA` or `$EUR` in any Discord channel and Yoink posts a price card with a chart. It works in game chat too: Yoink answers on that server. Paste a Solana or 0x contract address for a token card, `/newpairs <topic>` finds coins launched in the last 24 hours, and `/polymarket <search>` shows betting odds. Information only, not financial advice."
alts = ["price of bitcoin", "how do i check crypto", "stock price", "$btc", "ticker command", "how do the price cards work",
        "crypto prices", "how to check a coin", "new coins", "polymarket odds", "what is newpairs"]

[[entry]]
