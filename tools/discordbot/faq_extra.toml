# Yoink's /ask: what the bot knows beyond the website.
#
# Most answers come from the website: every FAQ on www.crispyanarchy.net (the /faq/ page and the question sections on
# the mode pages) is read every few hours, so a question added to marketing/site/build.py and deployed is one Yoink
# can answer. This file adds:
#   [[entry]]  answers that don't belong on a public page (bot features, small talk, other servers), and live answers
#              (live = "online" | "myvotes" | "mylink" | "help"), which the bot fills in with real data.
#   [alts]     extra ways people ask a website question, keyed by the website's exact question text. They only
#              help the matcher; the answer always comes from the site. If the site's question text changes,
#              /askadmin status lists the alts that no longer match anything.
# Edit on the host (/opt/crispybot/faq_extra.toml), then /askadmin reload in Discord. No restart needed.

[[entry]]
id = "online"
live = "online"
q = "Who is online right now?"
a = "Who's on each server right now."
alts = ["who is online", "is anyone on", "anyone playing rn", "how many people are on", "is anyone online on anarchy",
        "who's on", "player list", "is the server dead", "is anyone playing skyblock", "online players", "is anyone on right now",
        "who is playing", "how many players"]

