# Lobby spawn: every join is sent here; players above rescue-above-y (the barrier ceiling is at 319) are sent back.
spawn:
  on-join: true
  world: world
  x: 0.5
  y: 66
  z: 6.5
  yaw: 0
  pitch: 0
  rescue-above-y: 300

# Lobby sidebar (DeluxeHub's own scoreboard is switched off because it crashes on Paper 26.x).
# Placeholders: %player% %online% %online_max% %world%   Reload: /crispylobby
sidebar:
  enabled: true
  refresh-seconds: 5
  join-delay-ticks: 40
  title: "&d&lCrispyAnarchy &7(%online%/%online_max%)"
  lines:
    - "&7&m----------------------"
    - "&e&lPlayer:"
    - "  &f%player%"
    - "&7&m----------------------"

# Network stats board + /stats: vanilla stats from every server on this machine (and Factions balances), totalled
# per player name. Move the board with /crispylobby leaderboard here; force a re-read with /crispylobby leaderboard refresh.
network-stats:
  enabled: true
  instances-dir: /AMPStorage/.ampdata/instances
  factions-userdata: Factions01/Minecraft/plugins/Essentials/userdata
  refresh-minutes: 5
  rotate-seconds: 8
  top: 10
  location: {world: world, x: 0.5, y: 68.5, z: 12.5}

# Vote rewards. Votes arrive at NuVotifier on the lobby (plugins/Votifier, port 8193). Each vote = 1 reward the player
# sends to a server of their choice in /vote, plus points-per-vote points for cosmetics. A claimed reward waits in
# plugins/CrispyLobby/votes.json until the player is on that server, then the commands run there over RCON (port and
# password are read from the instance's own server.properties). Keys are the Velocity server names.
# Admin: /vote give <player> [n], /vote points <player> <+/-n>, /vote reload.
votes:
  points-per-vote: 1
  announce: true            # "X voted" in the lobby
  discord-relay: true       # also log it as a "<Votes> ..." chat line: the Discord bot posts it and cross-chats it to every server
  rcon-announce: false      # tellraw it to every server directly (turn on if the bot is down; else it shows twice)
  test-usernames: [PMC, TopG, MinecraftServers, test, Votifier]   # list sites' test votes: logged, no reward
  links:
    - {name: TopG, url: "https://topg.org/minecraft-servers/server-687311"}
    - {name: Planet Minecraft, url: "https://www.planetminecraft.com/server/crispy-anarchy-1-16-no-rules-survival/vote/"}
    - {name: MinecraftServers.org, url: "https://minecraftservers.org/vote/587166"}
    - {name: Minecraft-Server-List, url: "https://minecraft-server-list.com/server/503605/vote/"}
    - {name: MMTop200, url: "https://mmtop200.com/vote/5176"}
  servers:                  # order = menu order; a server with no commands only gets trails
    factions:
      label: "&e&lCrispy Factions"
      icon: TNT
      instance: Factions01
      reward: ["&a$5,000 &7+ &6Crispy Case", "&7bonus &eCase Key &7every 5th"]
      commands: ["vote test %player% CrispyAnarchy"]   # CrispyFactions' own vote reward (also counts toward its vote party)
    og:
      label: "&d&lCrispy Anarchy"
      icon: OBSIDIAN
      instance: CrispyAnarchy01
      reward: ["&b3 Diamonds", "&62 Golden Apples", "&a5 XP levels"]
      commands: ["give %player% minecraft:diamond 3", "give %player% minecraft:golden_apple 2", "xp add %player% 5 levels"]
    Vanilla:
      label: "&a&lCrispy Vanilla"
      icon: GRASS_BLOCK
      instance: Vanilla01
      commands: []            # no vote rewards on Vanilla (trails only)
    falling:
      label: "&e&lCrispy Falling"
      icon: GRAVEL
      instance: Falling01
      reward: ["&f4 Iron Ingots", "&f16 Bone Meal", "&a2 Saplings"]
      commands: ["give %player% minecraft:iron_ingot 4", "give %player% minecraft:bone_meal 16", "give %player% minecraft:oak_sapling 2"]
    pvp:
      label: "&c&lCrispy PvP"
      icon: NETHERITE_SWORD
      instance: CrispyPvP01
      commands: []

# Cosmetics, bought with vote points in /cosmetics (or /vote -> Cosmetics); one tag and one name colour at a time.
# Both show on every server and in cross-chat/Discord: the chat-tags plugin/mod on each server reads the lobby's
# plugins/CrispyLobby/tags.json and namecolors.json. Tags also show after the name in the tab list and on name tags
# (CrispyTags proxy plugin, through TAB). Name colours: code = legacy colour codes (&b, &6&l...) or rainbow.
cosmetics:
  tags:
    og:          {display: "&7[OG]", cost: 1, icon: OAK_LOG, joined-before: "2024-01-01"}   # see joined-sources
    crispy:      {display: "&6[Crispy]", cost: 3, icon: COOKIE}
    survivor:    {display: "&a[Survivor]", cost: 4, icon: TOTEM_OF_UNDYING}
    griefer:     {display: "&c[Griefer]", cost: 6, icon: FLINT_AND_STEEL}
    raider:      {display: "&3[Raider]", cost: 8, icon: TNT_MINECART}
    anarchist:   {display: "&4[Anarchist]", cost: 10, icon: TNT}
    skillissue:  {display: "&d&o[Skill Issue]", cost: 12, icon: WOODEN_SWORD}
    menace:      {display: "&5[Menace]", cost: 15, icon: WITHER_SKELETON_SKULL}
    legend:      {display: "&e&l[Legend]", cost: 25, icon: GOLD_BLOCK}
    # current events
    spooky:      {display: "&8[&6Spooky&8]", cost: 5, icon: CARVED_PUMPKIN, note: "Halloween 2026"}
    pumpkinking: {display: "&6&l[Pumpkin King]", cost: 13, icon: JACK_O_LANTERN, note: "Halloween 2026"}
    sulfur:      {display: "&e[Sulfur Miner]", cost: 7, icon: GLOWSTONE_DUST, note: "Chaos Cubed: the Sulfur Caves drop"}
    dank:        {display: "&2[Dank]", cost: 6, icon: SLIME_BALL, note: "The Great Meme Reset of 2026"}
    # earned tags (free): advancement = unlocked on any server in earned-sources; stat + min = network-total milestone;
    # stat + top = only while you're that high on the leaderboard (stats board categories, or VOTES = this month's votes)
    dragonslayer: {display: "&5[Dragonslayer]", icon: DRAGON_HEAD, advancement: "minecraft:end/kill_dragon", note: "Free the End (kill the Ender Dragon)"}
    withered:     {display: "&8[Withered]", icon: NETHER_STAR, advancement: "minecraft:nether/summon_wither", note: "Withering Heights (summon the Wither)"}
    beaconator:   {display: "&b[Beaconator]", icon: BEACON, advancement: "minecraft:nether/create_full_beacon", note: "Beaconator (a full-power beacon)"}
    netherite:    {display: "&8&l[Netherite]", icon: NETHERITE_CHESTPLATE, advancement: "minecraft:nether/netherite_armor", note: "Cover Me in Debris (full netherite armor)"}
    hunter:       {display: "&4[Monster Hunter]", icon: CROSSBOW, advancement: "minecraft:adventure/kill_all_mobs", note: "Monsters Hunted (kill every hostile mob)"}
    wanderer:     {display: "&2[Wanderer]", icon: COMPASS, advancement: "minecraft:adventure/adventuring_time", note: "Adventuring Time (visit every biome)"}
    hero:         {display: "&a[Hero]", icon: EMERALD, advancement: "minecraft:adventure/hero_of_the_village", note: "Hero of the Village (win a raid)"}
    wings:        {display: "&f[Wings]", icon: ELYTRA, advancement: "minecraft:end/elytra", note: "Sky's the Limit (find an elytra)"}
    uno:          {display: "&f[&cU&eN&aO&f]", icon: RED_CONCRETE, advancement: "crispy_uno:first_game", note: "Everyone has Uno... (play UNO in the lobby)"}
    veteran:      {display: "&6[Veteran]", icon: CLOCK, stat: PLAYTIME, min: 7200000}            # 100 h
    slayer:       {display: "&c[Slayer]", icon: IRON_SWORD, stat: MOB_KILLS, min: 10000}
    excavator:    {display: "&7[Excavator]", icon: DIAMOND_PICKAXE, stat: BLOCKS_MINED, min: 100000}
    nomad:        {display: "&3[Nomad]", icon: LEATHER_BOOTS, stat: DISTANCE, min: 500000000}       # 5,000 km
    deathwish:    {display: "&8[Deathwish]", icon: SKELETON_SKULL, stat: DEATHS, min: 300}
    warlord:      {display: "&4&l[Warlord]", icon: NETHERITE_SWORD, stat: PLAYER_KILLS, top: 1}
    nolifer:      {display: "&e[No-Lifer]", icon: RED_BED, stat: PLAYTIME, top: 3}
    tycoon:       {display: "&a&l[Tycoon]", icon: EMERALD_BLOCK, stat: MONEY, top: 1}
    patientzero:  {display: "&2&l[Patient Zero]", icon: ZOMBIE_HEAD, stat: OUTBREAK_WAVE, top: 1}
    unstoppable:  {display: "&c[Unstoppable]", icon: BLAZE_POWDER, stat: PVP_STREAK, top: 1}
    highroller:   {display: "&6[High Roller]", icon: GOLD_NUGGET, stat: BALATRO_BLINDS, top: 1}
    cardshark:    {display: "&c[Card Shark]", icon: PAPER, stat: UNO_WINS, top: 1}
    champion:     {display: "&6&l[Champion]", icon: GOLDEN_HELMET, stat: DUEL_RATING, top: 1}
    kitmaster:    {display: "&e[Kit Master]", icon: NETHER_STAR, stat: KITS_MASTERED, min: 1}
    topvoter:     {display: "&d&l[Top Voter]", icon: NETHER_STAR, stat: VOTES, top: 1}
  # "joined-before" tags: a player qualifies if the earliest date found here (relative to network-stats.instances-dir)
  # is before that date: advancement timestamps, the firstPlayed time Paper left in old player files, and those files'
  # last-saved date. extra: names that always qualify.
  joined-sources:
    advancements: [CrispyAnarchy01/Minecraft/world/players/advancements, Vanilla01/Minecraft/world/players/advancements]
    player-data: [CrispyAnarchy01/Minecraft/world/players/data, Vanilla01/Minecraft/world/players/data]
    extra: []   # names that always qualify (e.g. someone who played earlier on another account)
  # where earned tags look for completed advancements (relative to network-stats.instances-dir)
  earned-sources:
    advancements: [CrispyAnarchy01/Minecraft/world/players/advancements, Vanilla01/Minecraft/world/players/advancements,
                   Falling01/Minecraft/world/players/advancements, Factions01/Minecraft/world/advancements,
                   CrispyLobby01/Minecraft/world/players/advancements]
  # code: colour codes (&b, &c&l), a per-letter sequence ("&c|&6|&e"), or rainbow
  name-colors:
    aqua:     {name: Aqua, code: "&b", cost: 3, icon: LIGHT_BLUE_DYE}
