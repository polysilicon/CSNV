    purple:   {name: Purple, code: "&5", cost: 6, icon: PURPLE_DYE}
    bold:     {name: Bold White, code: "&f&l", cost: 8, icon: QUARTZ}
    stone:    {name: Stone, code: "&7", cost: 2, icon: LIGHT_GRAY_DYE}
    forest:   {name: Forest, code: "&2", cost: 4, icon: GREEN_DYE}
    crimson:  {name: Crimson, code: "&4", cost: 5, icon: REDSTONE}
    shadow:   {name: Shadow, code: "&8", cost: 5, icon: GRAY_DYE}
    boldred:  {name: Bold Red, code: "&c&l", cost: 8, icon: RED_CANDLE}
    boldaqua: {name: Bold Aqua, code: "&b&l", cost: 8, icon: LIGHT_BLUE_CANDLE}
    toxic:    {name: Toxic, code: "&2|&a", cost: 10, icon: SLIME_BLOCK}
    halloween: {name: Halloween, code: "&6|&8", cost: 10, icon: JACK_O_LANTERN}
    fire:     {name: Fire, code: "&4|&c|&6|&e", cost: 12, icon: BLAZE_POWDER}
    ocean:    {name: Ocean, code: "&1|&9|&3|&b", cost: 12, icon: HEART_OF_THE_SEA}
