# Lobby spawn: every join is sent here; players above rescue-above-y (the barrier ceiling is at 319) are sent back.
spawn:
  on-join: true
  world: world
  x: 0.5
  y: 66
  z: 6.5
  yaw: 0
  pitch: 0
  rescue-above-y: 300

# Lobby sidebar (DeluxeHub's own scoreboard is switched off because it crashes on Paper 26.x).
# Placeholders: %player% %online% %online_max% %world%   Reload: /crispylobby
sidebar:
  enabled: true
  refresh-seconds: 5
  join-delay-ticks: 40
  title: "&d&lCrispyAnarchy &7(%online%/%online_max%)"
  lines:
    - "&7&m----------------------"
    - "&e&lPlayer:"
    - "  &f%player%"
    - "&7&m----------------------"

# Network stats board + /stats: vanilla stats from every server on this machine (and Factions balances), totalled
# per player name. Move the board with /crispylobby leaderboard here; force a re-read with /crispylobby leaderboard refresh.
network-stats:
  enabled: true
  instances-dir: /AMPStorage/.ampdata/instances
  factions-userdata: Factions01/Minecraft/plugins/Essentials/userdata
  refresh-minutes: 5
  rotate-seconds: 8
  top: 10
  location: {world: world, x: 0.5, y: 68.5, z: 12.5}

# Vote rewards. Votes arrive at NuVotifier on the lobby (plugins/Votifier, port 8193). Each vote = 1 reward the player
# sends to a server of their choice in /vote, plus points-per-vote points for cosmetics. A claimed reward waits in
# plugins/CrispyLobby/votes.json until the player is on that server, then the commands run there over RCON (port and
# password are read from the instance's own server.properties). Keys are the Velocity server names.
# Admin: /vote give <player> [n], /vote points <player> <+/-n>, /vote reload.
votes:
  points-per-vote: 1
  announce: true            # "X voted" in the lobby
  discord-relay: true       # also log it as a "<Votes> ..." chat line: the Discord bot posts it and cross-chats it to every server
  rcon-announce: false      # tellraw it to every server directly (turn on if the bot is down; else it shows twice)
  test-usernames: [PMC, TopG, MinecraftServers, test, Votifier]   # list sites' test votes: logged, no reward
  links:
    - {name: TopG, url: "https://topg.org/minecraft-servers/server-687311"}
    - {name: Planet Minecraft, url: "https://www.planetminecraft.com/server/crispy-anarchy-1-16-no-rules-survival/vote/"}
    - {name: MinecraftServers.org, url: "https://minecraftservers.org/vote/587166"}
    - {name: Minecraft-Server-List, url: "https://minecraft-server-list.com/server/503605/vote/"}
    - {name: MMTop200, url: "https://mmtop200.com/vote/5176"}
    - {name: Minecraft-MP, url: "https://minecraft-mp.com/server/365762/vote/"}
  servers:                  # order = menu order; a server with no commands only gets trails
    factions:
      label: "&e&lCrispy Factions"
      icon: TNT
      instance: Factions01
      reward: ["&a$5,000 &7+ &6Crispy Case", "&7bonus &eCase Key &7every 5th"]
      commands: ["vote test %player% CrispyAnarchy"]   # CrispyFactions' own vote reward (also counts toward its vote party)
    og:
      label: "&d&lCrispy Anarchy"
      icon: OBSIDIAN
      instance: CrispyAnarchy01
      reward: ["&b3 Diamonds", "&62 Golden Apples", "&a5 XP levels"]
      commands: ["give %player% minecraft:diamond 3", "give %player% minecraft:golden_apple 2", "xp add %player% 5 levels"]
    Vanilla:
      label: "&a&lCrispy Vanilla"
      icon: GRASS_BLOCK
      instance: Vanilla01
      commands: []            # no vote rewards on Vanilla (trails only)
    falling:
      label: "&e&lCrispy Falling"
      icon: GRAVEL
      instance: Falling01
      reward: ["&f4 Iron Ingots", "&f16 Bone Meal", "&a2 Saplings"]
      commands: ["give %player% minecraft:iron_ingot 4", "give %player% minecraft:bone_meal 16", "give %player% minecraft:oak_sapling 2"]
    pvp:
      label: "&d&lMultiverse"
      icon: NETHERITE_SWORD
      instance: CrispyPvP01
      commands: []

